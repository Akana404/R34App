# npm is covered by the security updates switched on in the repo settings;
# version updates would open several PRs a week for this dependency tree.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
# No docker entry: the floating node:24 tag already picks up patches on every
# build, and all Dependabot would add is PRs for Node majors (odd ones included).
